# Cockpit authentication handler for Anaconda installer
#
# The cockpit-pin-auth script supports two modes:
#
# 1. PIN Authentication (default):
#    - User is prompted for PIN (hardcoded as "1234" for now)
#    - Suitable for remote access scenarios
#
# 2. Local Session (bypass auth):
#    - Set WEBUI_LOCAL_SESSION environment variable
#    - No authentication required
#    - Suitable for local installer scenarios
#
[Basic]
Command = /usr/libexec/anaconda/cockpit-pin-auth
